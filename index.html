<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Private desktop quotation management for La Casa Interiors, with optional Google Drive sync.">
  <title>La Casa | Quote Studio</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="application">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-logo" src="assets/la-casa-logo.png" alt="La Casa Interiors">
        <span class="brand-caption">INTERIORS QUOTE STUDIO</span>
      </div>

      <div class="sidebar-label">WORKSPACE</div>
      <nav class="navigation" aria-label="Main navigation">
        <button class="nav-link" type="button" data-nav="dashboard">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg>
          <span>Overview</span>
        </button>
        <button class="nav-link" type="button" data-nav="quotes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h8l5 5v12a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M14 3v6h6M9 14h7M9 17h7"/></svg>
          <span>Quotations</span>
          <span class="nav-count" id="quoteCount">0</span>
        </button>
        <button class="nav-link" type="button" data-nav="catalog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v6H4zM4 14h7v6H4zM14 14h6v6h-6z"/><path d="M9 7h.01M16 17h.01"/></svg>
          <span>Line item library</span>
        </button>
        <button class="nav-link" type="button" data-nav="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1a1.8 1.8 0 0 1-2.5 2.5l-.1-.1a1.8 1.8 0 0 0-3 .1v.2a1.8 1.8 0 0 1-3.6 0v-.2a1.8 1.8 0 0 0-3-.1l-.1.1a1.8 1.8 0 0 1-2.5-2.5l.1-.1a1.8 1.8 0 0 0-.1-3h-.2a1.8 1.8 0 0 1 0-3.6h.2a1.8 1.8 0 0 0 .1-3l-.1-.1a1.8 1.8 0 0 1 2.5-2.5l.1.1a1.8 1.8 0 0 0 3-.1v-.2a1.8 1.8 0 0 1 3.6 0v.2a1.8 1.8 0 0 0 3 .1l.1-.1a1.8 1.8 0 0 1 2.5 2.5l-.1.1a1.8 1.8 0 0 0 .1 3h.2a1.8 1.8 0 0 1 0 3.6h-.2a1.8 1.8 0 0 0-1.1 1.9Z"/></svg>
          <span>Settings</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <span class="privacy-indicator"><span></span>PRIVATE BY DEFAULT</span>
        <p>Your data stays on this computer unless you choose Google Drive sync.</p>
        <span class="sidebar-version">Quote Studio <span>·</span> v1.0</span>
      </div>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="topbar-right">
          <span class="local-badge"><span class="local-dot"></span>Saved on this device</span>
          <button class="button button-primary button-small" type="button" data-action="new-quote">
            <span class="plus-sign" aria-hidden="true">+</span> New quotation
          </button>
        </div>
      </header>

      <section class="page-content" id="pageContent"></section>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="backupInput" accept=".json,application/json" hidden>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
